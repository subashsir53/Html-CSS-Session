<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Session</title>
  </head>
  <body>
    <h2>
      <u><font color="darkblue">Student Registration Form</font></u>
    </h2>
    <form>
      <label for="name">First Name : </label>
      <input type="text" placeholder="Enter your First Name" id="name" />
      <br /><br /><label for="name">Last Name : </label>
      <input type="text" placeholder="Enter your Last Name" id="name" />
      <br /><br /><label for="email">Email : </label>
      <input type="email" id="email" placeholder="abc@gmail.com" />
      <br /><br /><label for="password">Password :</label>
      <input type="password" placeholder="Enter your passwprd" />
      <br /><br /><label for="phone">Phone Number :</label>
      <input type="tel" name="phone" placeholder="Enter your Phone Number" />
      <br /><br /><label> Date of Birth :</label> <input type="date" /> <br />
      <br />
      <label> Feedback : </label><br />
      <textarea
        placeholder="Enter Your Feedback "
        rows="10"
        cols="80"
      ></textarea>
      <br /><br />
      <label>Select Your Gender :</label><br />

      <input type="radio" name="Gender" value="male" />Male<br />

      <input type="radio" name="Gender" value="Female" />Female<br />

      <input type="radio" name="Gender" value="other" />Other<br />
      <br />

      <label> Choose Your Country :</label><br />

      <input type="checkbox" value="nepal" />Nepal<br />

      <input type="checkbox" value="china" />China<br />

      <input type="checkbox" value="india" />India <br /><br />
      <!-- Button-->

      <button>Login</button><br /><br />
      <button>Register</button>
      <!-- Dropdown --><br /><br />
      <label> Select Course</label><br />
      <br />

      <select name="Couse">
        <option value="0" disabled selected>Select Course</option>
        <option value="BCA">BCA</option>
        <br />
        <option value="BSC CSIT">BSC CSIT</option>
        <br />
        <option value="BIT">BIT</option>
        <br />
        <option value="BBA">BBA</option>
        <br />
        <option value="CA">CA</option>
        <br />
      </select>
    </form>
  </body>
</html>
